server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: FishPic-backend
  web:
    client:
      connect-timeout: 30s
      read-timeout: 30s
  mvc:
    throw-exception-if-no-handler-found: true
  servlet:
    multipart:
      # 单个文件最大大小
      max-file-size: 25MB
      # 一次请求总大小
      max-request-size: 100MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/FishPics}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      database: 0
      port: ${REDIS_PORT:6379}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # SpringAIAlibaba 配置
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen3.5-plus-2026-04-20
          multi-model: true
      image:
        options:
          model: qwen-image-2.0

jwt:
  secret: ${JWT_SECRET}

knife4j:
  enable: true
  openapi:
    title: fish图库测试文档
    description: "fish图库测试文档"
    email: 3057433102@qq.com
    concat: fish
    version: v0.5
    group:
      test:
        group-name: 开发测试
        api-rule: package
        api-rule-resources:
          - hk.ljx.fishpicsbackend.user
          - hk.ljx.fishpicsbackend.picture
          - hk.ljx.fishpicsbackend.space
          - hk.ljx.fishpicsbackend.system
          - hk.ljx.fishpicsbackend.ai
          - hk.ljx.fishpicsbackend.task
          - hk.ljx.fishpicsbackend.collab
          - hk.ljx.fishpicsbackend.picture
          - hk.ljx.fishpicsbackend.share

# 腾讯云 COS 配置: 从环境变量读
cos:
  secretId: ${COS_SECRET_ID:}
  secretKey: ${COS_SECRET_KEY:}
  region: ${COS_REGION:}
  bucket: ${COS_BUCKET:}
  url: ${COS_URL:}

collab:
  websocket:
    allowed-origins: ${COLLAB_WS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

logging:
  level:
    root: info
    hk.ljx.fishpicsbackend: debug
    org.mybatis: debug
    org.springframework.jdbc.core: debug
