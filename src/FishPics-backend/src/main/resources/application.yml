server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: FishPic-backend
  servlet:
    multipart:
      # 单个文件最大大小
      max-file-size: 25MB
      # 一次请求总大小
      max-request-size: 100MB
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/FishPics
    username: # 数据库账号
    password: # 数据库密码
  data:
    redis:
      host: # redis 地址
      database: 0
      port: 6379
  profiles: # 使用本地环境配置文件
    active: local

rocketmq:
  name-server: localhost:9876
  producer:
    group: fish-pics-producer-group
    send-message-timeout: 3000 # 消息发送超时时间，默认 3s
    retry-times-when-send-failed: 3 # 同步发送消息失败后，重试的次数
    retry-times-when-send-async-failed: 3 # 异步发送消息失败后，重试的次数
    max-message-size: 4096 # 消息最大大小（单位：字节）
  consumer:
    group: fish-pics-consumer-group
    pull-batch-size: 5 # 每次拉取的最大消息数


